modules:
  jira:projectPage:
    - key: seepsight-project-page
      resource: dashboard
      resolver:
        function: resolver
      title: Seepsight Intelligence
  jira:issuePanel:
    - key: seepsight-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      title: Seepsight Intelligence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: dashboard
    path: static/dashboard
  - key: issue-panel
    path: static/issue-panel
app:
  id: "<your app id>"
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - read:jira-work
