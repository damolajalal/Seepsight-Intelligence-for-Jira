modules:
  jira:projectPage:
    - key: seepsight-project-page
      resource: dashboard
      resolver:
        function: resolver
      title: Seepsight Intelligence
  jira:issuePanel:
    - key: seepsight-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      title: Seepsight Intelligence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: dashboard
    path: static/dashboard
    tunnel:
      port: 3000
  - key: issue-panel
    path: static/issue-panel
    tunnel:
      port: 3001
app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
