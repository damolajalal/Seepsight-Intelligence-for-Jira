name: Validate Forge app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Build Custom UI bundles
        run: npm run build:ui

      - name: Validate Forge manifest when Atlassian secrets are configured
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          if [ -n "$FORGE_EMAIL" ] && [ -n "$FORGE_API_TOKEN" ]; then
            npx forge lint
          else
            echo "Forge lint skipped. Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions secrets to enable authenticated manifest validation."
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API security and tenant-isolation tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
