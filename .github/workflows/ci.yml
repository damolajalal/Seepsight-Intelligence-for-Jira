name: Validate Forge app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run unit tests
        run: npm test

      - name: Build Custom UI bundles
        run: npm run build:ui

      - name: Disable Forge CLI usage analytics in CI
        run: npx forge settings set usage-analytics false

      - name: Validate Forge manifest
        run: npm run lint
