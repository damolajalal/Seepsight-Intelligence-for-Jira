name: Validate Forge app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Build complete Custom UI resources
        run: npm run build:ui

      - name: Build UI with deterministic Forge bridge fixture for browser tests
        run: npm run build:ui:test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run Chromium UI interaction tests
        run: npm run test:browser

      - name: Validate Forge manifest when Atlassian secrets are configured
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          if [ -n "$FORGE_EMAIL" ] && [ -n "$FORGE_API_TOKEN" ]; then
            npx forge lint
          else
            echo "Forge lint skipped. Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions secrets to enable authenticated manifest validation."
          fi
