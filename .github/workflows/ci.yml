name: Validate Forge app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Build Custom UI bundles
        run: npm run build:ui

      - name: Validate Forge manifest (requires optional Atlassian secrets)
        if: ${{ env.FORGE_EMAIL != '' && env.FORGE_API_TOKEN != '' }}
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: npx forge lint

      - name: Explain skipped authenticated Forge lint
        if: ${{ env.FORGE_EMAIL == '' || env.FORGE_API_TOKEN == '' }}
        run: echo "Forge lint skipped. Add FORGE_EMAIL and FORGE_API_TOKEN as GitHub Actions secrets to enable authenticated manifest validation."
